<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sprutkoll (Google Drive)</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --subtext: #aaaaaa;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h1 { text-align: center; margin-bottom: 4px; font-size: 24px; }
    p.subtitle { text-align: center; color: var(--subtext); margin-top: 0; margin-bottom: 20px; font-size: 14px; }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      text-align: center;
    }

    .next-leg {
      font-size: 26px;
      font-weight: bold;
      margin: 12px 0;
      padding: 16px;
      border-radius: 12px;
      background: #2a2a2a;
    }

    .next-leg.right { color: #64b5f6; border: 2px solid #64b5f6; }
    .next-leg.left { color: #81c784; border: 2px solid #81c784; }

    button.action-btn {
      background: #3a7bd5;
      color: white;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      margin-top: 12px;
    }

    button.action-btn:active { opacity: 0.8; }
    
    button.reset-btn {
      background: transparent;
      color: #888;
      border: 1px solid #444;
      padding: 8px 16px;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 12px;
    }

    h3 { margin-top: 0; text-align: left; font-size: 18px; }

    ul.history-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 180px;
      overflow-y: auto;
      text-align: left;
    }

    ul.history-list li {
      padding: 10px 8px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }

    ul.history-list li:last-child { border-bottom: none; }
    
    .sync-status {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Sprutkoll</h1>
    <p class="subtitle">Synkad via Google Drive</p>

    <div class="card">
      <div style="font-size: 13px; color: var(--subtext);">Nästa tillfälle:</div>
      <div id="nextLegDisplay" class="next-leg">Laddar...</div>
      <div id="nextDateDisplay" style="font-size: 13px; color: var(--subtext); margin-bottom: 12px;"></div>
      
      <button class="action-btn" onclick="logInjection()">Registrera utförd spruta idag</button>
      <div id="syncStatus" class="sync-status">Synkar med Drive...</div>
    </div>

    <div class="card">
      <h3>Historik</h3>
      <ul id="historyList" class="history-list"></ul>
      <button class="reset-btn" onclick="clearHistory()">Rensa historik</button>
    </div>
  </div>

  <script>
    // Klistra in din webbapp-URL från Google Apps Script här:
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxGOFn9ZGzHuIpjZY7bUKycm_LC4y5TWabOrzqBmzLFM2yZcfPIX9KWqaAERHMjQEGT/exec';

    let history = JSON.parse(localStorage.getItem('injection_history')) || [];

    async function loadData() {
      updateUI(); // Visa lokal cache direkt så appen känns blixtsnabb
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('DIN_GOOGLE')) {
        document.getElementById('syncStatus').innerText = 'Lokal lagring (ej kopplad till Drive än)';
        return;
      }

      try {
        document.getElementById('syncStatus').innerText = 'Hämtar från Google Drive...';
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const cloudHistory = await response.json();
        
        if (Array.isArray(cloudHistory)) {
          history = cloudHistory;
          localStorage.setItem('injection_history', JSON.stringify(history));
          updateUI();
        }
        document.getElementById('syncStatus').innerText = 'Synkad med Google Drive ✓';
      } catch (err) {
        console.error('Kunde inte hämta från Drive', err);
        document.getElementById('syncStatus').innerText = 'Offline – visar lokalt sparad data';
      }
    }

    async function saveData() {
      localStorage.setItem('injection_history', JSON.stringify(history));
      updateUI();

      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('DIN_GOOGLE')) return;

      try {
        document.getElementById('syncStatus').innerText = 'Sparar till Google Drive...';
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(history)
        });
        document.getElementById('syncStatus').innerText = 'Sparad i Google Drive ✓';
      } catch (err) {
        console.error('Kunde inte spara till Drive', err);
        document.getElementById('syncStatus').innerText = 'Kunde inte nå Drive (sparad lokalt)';
      }
    }

    function updateUI() {
      const nextLegDisplay = document.getElementById('nextLegDisplay');
      const nextDateDisplay = document.getElementById('nextDateDisplay');
      const historyList = document.getElementById('historyList');

      let nextLeg = 'Höger ben';
      if (history.length > 0) {
        const lastLeg = history[0].leg;
        nextLeg = (lastLeg === 'Höger ben') ? 'Vänster ben' : 'Höger ben';
      }

      nextLegDisplay.innerText = nextLeg;
      nextLegDisplay.className = 'next-leg ' + (nextLeg.includes('Höger') ? 'right' : 'left');

      if (history.length > 0) {
        let lastDate = new Date(history[0].dateObj);
        let nextDate = new Date(lastDate.getTime() + (14 * 24 * 60 * 60 * 1000));
        nextDateDisplay.innerText = 'Beräknat datum: ' + nextDate.toLocaleDateString('sv-SE', { weekday: 'short', month: 'short', day: 'numeric' });
      } else {
        nextDateDisplay.innerText = 'Ingen historik registrerad än.';
      }

      historyList.innerHTML = '';
      if (history.length === 0) {
        historyList.innerHTML = '<li style="color: #777; text-align: center; padding: 12px;">Inga sprutor loggade ännu.</li>';
      } else {
        history.forEach((item) => {
          const li = document.createElement('li');
          li.innerHTML = `<span><strong>${item.leg}</strong></span> <span style="color: #aaa;">${item.dateStr}</span>`;
          historyList.appendChild(li);
        });
      }
    }

    async function logInjection() {
      let nextLeg = 'Höger ben';
      if (history.length > 0) {
        nextLeg = (history[0].leg === 'Höger ben') ? 'Vänster ben' : 'Höger ben';
      }

      const now = new Date();
      const dateStr = now.toLocaleDateString('sv-SE', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

      const entry = {
        leg: nextLeg,
        dateStr: dateStr,
        dateObj: now.toISOString()
      };

      history.unshift(entry);
      await saveData();
    }

    async function clearHistory() {
      if (confirm('Vill du rensa all historik?')) {
        history = [];
        await saveData();
      }
    }

    loadData();
  </script>
</body>
</html>
